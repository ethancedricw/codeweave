services:
  postgres:
    image: postgres:16
    container_name: codeweave-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: codeweave
      POSTGRES_USER: codeweave
      POSTGRES_PASSWORD: codeweave
    ports:
      - "5432:5432"
    volumes:
      - codeweave-postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: codeweave-redis
    restart: unless-stopped
    command: redis-server --requirepass codeweave
    ports:
      - "6379:6379"
    volumes:
      - codeweave-redis-data:/data

  minio:
    image: quay.io/minio/minio:latest
    container_name: codeweave-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: codeweave
      MINIO_ROOT_PASSWORD: CodeWeaveMinio2026!
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - codeweave-minio-data:/data

volumes:
  codeweave-postgres-data:
  codeweave-redis-data:
  codeweave-minio-data:
