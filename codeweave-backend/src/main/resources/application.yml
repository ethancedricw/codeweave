spring:
  application:
    name: codeweave-backend
  profiles:
    active: local
  sql:
    init:
      mode: always
server:
  port: 8080
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
sa-token:
  token-name: codeweave-token
  token-style: jwt
  is-concurrent: true
  is-share: false
  is-read-cookie: true
  is-write-header: true
codeweave:
  workspace:
    root: ${CODEWEAVE_WORKSPACE_ROOT:${java.io.tmpdir}/codeweave-workspaces}
  agent:
    dsh:
      base-url: http://127.0.0.1:3080
      console-url: http://127.0.0.1:3080
      proxy-base-url: http://127.0.0.1:8080
      proxy-secret: ""
      timeout-seconds: 15
      auth-token: ""
      auto-start: false
      working-directory: ""
      node-command: node
      launch-args:
        - --import
        - tsx/esm
        - apps/cli/src/bin.ts
        - web
        - --no-open
      startup-timeout-seconds: 15
  security:
    encryption-key: codeweave-local-model-key-2026-change-before-production
  stream:
    session-events: cw:session:events
    runner-events: cw:runner:events
    approval-events: cw:approval:events
  storage:
    minio:
      endpoint: http://127.0.0.1:9000
      access-key: codeweave
      secret-key: CodeWeaveMinio2026!
      bucket: codeweave-snapshots
      secure: false
      presigned-url-expiry-seconds: 900
